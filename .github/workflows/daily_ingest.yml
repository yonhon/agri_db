name: Daily Shikyo Ingest

on:
  # 通常の起動。Supabase の pg_cron が JST 12:17 と 14:47 に GitHub の API から呼ぶ（sql/schedule_ingest.sql）。
  # 市況PDFは JST 11時台に公開される
  workflow_dispatch:
  schedule:
    # 保険。GitHub の定時起動は数時間遅れることがあるので、Supabase からの起動が止まったときのためだけに残す
    # JST 14:47
    - cron: "47 5 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m src.agri_db.main
