name: MCP Server (Supabase Edge Function)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - "tests/**"
      - ".github/workflows/deploy_mcp.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - "tests/**"
      - ".github/workflows/deploy_mcp.yml"

permissions:
  contents: read

concurrency:
  group: "mcp-deploy"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run tests
        run: node --test tests/agri-mcp.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # プロジェクト参照ID（dashboard/config.js の URL の サブドメイン部分）
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'byhthaiwbutqstrqbwwc' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::リポジトリのシークレット SUPABASE_ACCESS_TOKEN が未設定です（README の「11. Claude から市況データを使う（MCPサーバー）」を参照）"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy agri-mcp
        run: supabase functions deploy agri-mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Smoke test
        run: |
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/agri-mcp"
          body='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"list_items","arguments":{"days":7}}}'
          for i in 1 2 3; do
            res=$(curl -sS -X POST "$url" -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -d "$body" || true)
            if echo "$res" | grep -q '"latest_data_date'; then
              echo "OK: $url"
              exit 0
            fi
            sleep 5
          done
          echo "::error::配備後の動作確認に失敗しました: $res"
          exit 1
